# Builds the DMG when a GitHub release is published and attaches it to that release.
# The release itself (title, notes) is written by hand; this only adds the DMG.
name: Release DMG

on:
  release:
    types: [published]

permissions:
  contents: write   # needed to upload the release asset

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Tag "v0.0.1" -> version "0.0.1" in the bundle (only in this build, not committed).
      - name: Set version from tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" Resources/Info.plist
          plutil -replace CFBundleVersion -string "$VERSION" Resources/Info.plist

      - name: Build
        run: ./build.sh

      - name: Upload DMG to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/p-timer-mac.dmg --clobber
